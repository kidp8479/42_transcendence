events {}

http {
    # Only send "Connection: upgrade" on requests that are actually asking
    # for one - socket.io's plain long-polling requests have no Upgrade
    # header, sending it anyway confuses keep-alive on the backend side.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Without this, nginx resolves each service name once at startup and
    # keeps using that IP forever - if a container gets recreated (its IP
    # changes on the docker/podman network), nginx keeps hitting the dead
    # old IP until nginx itself is restarted (502/504s in the meantime).
    # Using a variable in proxy_pass (see each location below) forces nginx
    # to re-resolve through this resolver on every request instead of
    # caching at config-load time. Both addresses are the embedded DNS
    # server on Docker's default bridge network (127.0.0.11) and on
    # podman's default network (the network gateway, commonly 10.89.0.1) -
    # nginx tries each until one answers, so this works across both setups.
    resolver 127.0.0.11 10.89.0.1 valid=15s;

    server {
        listen 8080;
        server_name 127.0.0.1;

        return 308 http://localhost:8080$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name localhost _;

        # Frontend (dev) - proxies to Vite which handles deep links natively.
        # In prod, replace this block with:
        #   root /usr/share/nginx/html;
        #   try_files $uri /index.html;
        # try_files ensures deep links (/dashboard, /project/123) always serve index.html
        # so TanStack Router can handle the routing client-side instead of nginx returning a 404.
        location / {
            set $frontend_upstream http://frontend:5173;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Backend API
        location /api {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket
        location /ws {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Auth service
        location = /auth/internal {
            return 404;
        }

        location ^~ /auth/internal/ {
            return 404;
        }

        location /auth {
            set $auth_upstream http://auth:3001;
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
