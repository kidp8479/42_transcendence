events {}

http {
    limit_req_zone $binary_remote_addr zone=ws_handshake_rate:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=ws_handshake_concurrency:10m;

    # Never put WebSocket query parameters in access logs. The one-time
    # admission ticket travels in the Socket.IO handshake query and must not
    # be copied into log storage even though it expires quickly.
    log_format ws_redacted '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent"';

    # Only send "Connection: upgrade" on requests that are actually asking
    # for one - socket.io's plain long-polling requests have no Upgrade
    # header, sending it anyway confuses keep-alive on the backend side.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Without this, nginx resolves each service name once at startup and
    # keeps using that IP forever - if a container gets recreated (its IP
    # changes on the docker/podman network), nginx keeps hitting the dead
    # old IP until nginx itself is restarted (502/504s in the meantime).
    # Using a variable in proxy_pass (see each location below) forces nginx
    # to re-resolve through this resolver on every request instead of
    # caching at config-load time.
    #
    # __DOCKER_RESOLVER__ is substituted at container startup (see nginx's
    # command: in docker-compose.yml) with whatever nameserver actually
    # shows up in /etc/resolv.conf - Docker's embedded DNS and podman's
    # aardvark-dns both write themselves in there under their own network,
    # so this always points at a real, reachable resolver instead of a
    # second hardcoded guess that may not exist on a given machine's
    # network (a guess that doesn't answer isn't just unused, it costs a
    # DNS timeout on every cache expiry, which was itself the cause of the
    # intermittent multi-second stalls this branch had - see TR-57 session
    # notes).
    resolver __DOCKER_RESOLVER__ valid=15s ipv6=off;

    server {
        listen 8080;
        server_name 127.0.0.1;

        return 308 http://localhost:8080$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name localhost _;

        # Frontend (dev) - proxies to Vite which handles deep links natively.
        # In prod, replace this block with:
        #   root /usr/share/nginx/html;
        #   try_files $uri /index.html;
        # try_files ensures deep links (/dashboard, /project/123) always serve index.html
        # so TanStack Router can handle the routing client-side instead of nginx returning a 404.
        location / {
            set $frontend_upstream http://frontend:5173;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }

        # Backend API
        location /api {
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket
        location /ws {
            access_log /var/log/nginx/access.log ws_redacted;
            # nginx's limit diagnostics include the full request line. Keep
            # those below the location's error threshold so rejected ticket
            # queries are not copied into error logs either.
            error_log /var/log/nginx/error.log crit;
            # This is only a coarse edge safeguard. Per-account ticket
            # issuance is limited by the auth service, so shared campus/NAT
            # addresses must retain enough headroom for normal reconnects.
            limit_req zone=ws_handshake_rate burst=60 nodelay;
            limit_req_status 429;
            limit_req_log_level info;
            limit_conn ws_handshake_concurrency 100;
            limit_conn_status 429;
            limit_conn_log_level info;

            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 16m;
            proxy_send_timeout 16m;
        }

        # Auth service
        location = /auth/internal {
            return 404;
        }

        location ^~ /auth/internal/ {
            return 404;
        }

        location /auth {
            set $auth_upstream http://auth:3001;
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
