openapi: 3.1.0
info:
  title: 42 Projects Planner Auth Service
  version: 0.1.0
  description: Contract owned by the Go authentication service.
  x-implementation-status-values:
    implemented: Available in the current foundation.
    planned: Contract reserved for a later implementation phase.
servers:
  - url: /auth
paths:
  /health:
    get:
      operationId: authHealth
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /register:
    post:
      operationId: registerLocalAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /login:
    post:
      operationId: loginLocalAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /logout:
    post:
      operationId: logout
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Refresh-token family revoked and cookies cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /refresh:
    post:
      operationId: refreshAccessToken
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /ws-ticket:
    post:
      operationId: issueWebSocketTicket
      description: >
        Exchanges an active access JWT for a hash-only, one-use ticket with the
        fixed transcendence-ws audience and a 60-second lifetime.
      security:
        - accessBearer: []
      responses:
        "201":
          description: One-time WebSocket admission ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketTicketResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /oauth/42/start:
    get:
      x-implementation-status: planned
      operationId: start42Login
      security: []
      responses:
        "302":
          description: Redirect to the 42 OAuth authorization endpoint.
  /oauth/42/callback:
    get:
      x-implementation-status: planned
      operationId: complete42Login
      description: Completes either login or an authenticated explicit-link transaction, as recorded by OAuthTransaction.
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session created and browser redirected to the application.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /oauth/google/start:
    get:
      x-implementation-status: planned
      operationId: startGoogleLogin
      security: []
      responses:
        "302":
          description: Redirect to Google with state, PKCE, and nonce.
  /oauth/google/callback:
    get:
      x-implementation-status: planned
      operationId: completeGoogleLogin
      description: Completes either login or an authenticated explicit-link transaction, as recorded by OAuthTransaction.
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Session created and browser redirected to the application.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /email-verification/request:
    post:
      x-implementation-status: planned
      operationId: requestEmailVerification
      security:
        - accessBearer: []
      responses:
        "202":
          description: Verification delivery accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /email-verification/confirm:
    post:
      x-implementation-status: planned
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimeTokenRequest"
      responses:
        "204":
          description: Email verified.
        "400":
          $ref: "#/components/responses/BadRequest"
  /password-reset/request:
    post:
      x-implementation-status: planned
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Reset delivery accepted without disclosing account existence.
        "429":
          $ref: "#/components/responses/RateLimited"
  /password-reset/confirm:
    post:
      x-implementation-status: planned
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "204":
          description: Password replaced and existing sessions revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
  /account/link/{provider}:
    post:
      x-implementation-status: planned
      operationId: startAccountLink
      description: The normal provider callback completes the link using the OAuthTransaction purpose.
      security:
        - accessBearer: []
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            enum: [FORTY_TWO, GOOGLE]
      responses:
        "200":
          description: Returns the provider authorization URL for explicit linking.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/introspect:
    post:
      operationId: introspectAccessToken
      description: >
        Internal endpoint. nginx must not expose this path publicly. Invalid,
        expired JWTs and inactive refresh families return typed 401 responses.
        Vault, database, or other dependency failures return typed 503 responses.
      security:
        - internalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntrospectionRequest"
      responses:
        "200":
          description: Active bearer access token and refresh-token family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/ws-ticket/consume:
    post:
      operationId: consumeWebSocketTicket
      description: >
        Internal endpoint. Atomically consumes exactly one unexpired ticket and
        returns its active user and refresh-family identity.
      security:
        - internalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSocketTicketRequest"
      responses:
        "200":
          description: Ticket consumed and connection identity established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketAdmissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/ws-session/revalidate:
    post:
      operationId: revalidateWebSocketSession
      description: Internal endpoint used to disconnect sockets after family or user revocation.
      security:
        - internalBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSocketSessionRequest"
      responses:
        "200":
          description: Refresh family and user remain active.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    refreshCookie:
      type: apiKey
      in: cookie
      name: tr_refresh
    accessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-internal-secret
  parameters:
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        password:
          type: string
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
    TokenResponseBody:
      type: object
      required:
        [accessToken, tokenType, expiresIn, user, csrfToken, idleExpiresAt, absoluteExpiresAt]
      properties:
        accessToken:
          type: string
        tokenType:
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
        csrfToken:
          type: string
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    AuthenticatedUser:
      type: object
      required: [id, email, emailVerified, username]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        username:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri
        campus:
          type: [string, "null"]
    IntrospectionRequest:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken:
          type: string
    WebSocketTicketResponse:
      type: object
      additionalProperties: false
      required: [ticket, expiresIn]
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
        expiresIn:
          const: 60
    WebSocketTicketRequest:
      type: object
      additionalProperties: false
      required: [ticket]
      properties:
        ticket:
          type: string
          minLength: 43
          maxLength: 43
    WebSocketSessionRequest:
      type: object
      additionalProperties: false
      required: [sub, sid]
      properties:
        sub:
          type: string
          format: uuid
        sid:
          type: string
          format: uuid
    WebSocketAdmissionResponse:
      type: object
      additionalProperties: false
      required: [active, sub, sid, username, avatarUrl]
      properties:
        active:
          const: true
        sub:
          type: string
          format: uuid
        sid:
          type: string
          format: uuid
        username:
          type: string
        avatarUrl:
          type: [string, "null"]
    IntrospectionResponse:
      type: object
      required:
        - active
        - sub
        - sid
        - jti
        - exp
        - auth_time
        - global_roles
        - authenticationMethod
        - assuranceLevel
        - authenticatedAt
        - idleExpiresAt
        - absoluteExpiresAt
      properties:
        active:
          const: true
        sub:
          type: string
          format: uuid
        sid:
          type: string
          format: uuid
        jti:
          type: string
        exp:
          type: integer
        auth_time:
          type: integer
        global_roles:
          type: array
          minItems: 1
          items:
            enum: [USER, PLATFORM_ADMIN]
        authenticationMethod:
          enum: [LOCAL, FORTY_TWO, GOOGLE]
          description: LOCAL maps to local-password, FORTY_TWO to 42-oauth2, and GOOGLE to google-oidc.
        assuranceLevel:
          type: integer
          minimum: 1
          maximum: 2
          description: 1 is single-factor; 2 is multi-factor step-up.
        authenticatedAt:
          type: string
          format: date-time
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        code:
          type: string
          enum:
            - INVALID_INTERNAL_CREDENTIALS
            - SESSION_INACTIVE
            - TOKEN_INVALID
            - TOKEN_INACTIVE
            - INTROSPECTION_UNAVAILABLE
            - TICKET_INVALID
            - TICKET_ISSUE_UNAVAILABLE
            - TICKET_CONSUME_UNAVAILABLE
            - SESSION_REVALIDATION_UNAVAILABLE
          description: Present when callers must distinguish an internal introspection failure.
    OneTimeTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
        password:
          type: string
          minLength: 12
          maxLength: 128
  responses:
    TokenResponse:
      description: Access JWT plus refresh-family metadata.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponseBody"
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed or the session is inactive.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Origin or CSRF validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Email, username, or identity already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Authentication storage or processing failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A signing, key, database, or auth-service dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
