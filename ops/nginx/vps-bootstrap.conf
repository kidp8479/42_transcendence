server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name tomato.iops.dev tomato-dev.iops.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
