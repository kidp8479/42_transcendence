map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

log_format ws_redacted '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;

    return 444;
}

server {
    listen 80;
    server_name tomato-dev.iops.dev;

    return 308 https://tomato-dev.iops.dev$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name tomato-dev.iops.dev;

    ssl_certificate     /etc/nginx/tls/tomato-dev.iops.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/tomato-dev.iops.dev/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name tomato-dev.iops.dev;
    # This is valid only for the same-host loopback TLS bridge. The Compose
    # ingress still presents its environment-specific Vault PKI certificate.
    proxy_ssl_verify off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 16m;
    proxy_send_timeout 16m;

    location = /auth/internal {
        return 404;
    }

    location ^~ /auth/internal/ {
        return 404;
    }

    location /ws {
        access_log /var/log/nginx/tomato-dev-ws-access.log ws_redacted;
        error_log /var/log/nginx/tomato-dev-ws-error.log crit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_pass https://127.0.0.1:8444;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass https://127.0.0.1:8444;
    }
}
