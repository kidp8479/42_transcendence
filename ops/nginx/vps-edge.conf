map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $host $bridge_upstream {
    tomato.iops.dev 127.0.0.1:8443;
}

log_format ws_redacted '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name tomato.iops.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name tomato.iops.dev;
    ssl_certificate /etc/letsencrypt/live/tomato.iops.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tomato.iops.dev/privkey.pem;
    include /etc/nginx/conf.d/transcendence-bridge.inc;
}
