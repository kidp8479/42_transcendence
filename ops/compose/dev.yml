services:
  rustfs:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE}

  nginx:
    ports:
      - "8080:8080"
      - "127.0.0.1:8444:8443"
    environment:
      FRONTEND_PORT: 5173

  db:
    ports:
      - "127.0.0.1:5432:5432"

  vault:
    ports:
      - "127.0.0.1:8200:8200"

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  migration:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  backend-vault-test:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  auth:
    build:
      target: dev
    volumes:
      - ./auth:/app
