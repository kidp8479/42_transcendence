services:
  rustfs:
    ports: !override []
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"

  nginx:
    ports: !override
      - "127.0.0.1:${APP_INGRESS_PORT:?set_app_ingress_port}:8443"
    environment:
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_PARTS: FH
      RESOLVER_CONFIG: valid=15s ipv6=off
      FRONTEND_PORT: 80
    volumes: !override
      - ./nginx/default.production.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/includes/application-locations.conf.template:/etc/nginx/templates/includes/application-locations.conf.template:ro
      - ./nginx/modsecurity/10-task-rabbit-config.conf:/etc/modsecurity.d/owasp-crs/plugins/10-task-rabbit-config.conf:ro
      - ./nginx/99-reload-on-certificate-change.sh:/docker-entrypoint.d/99-reload-on-certificate-change.sh:ro
      - vault_nginx_tls:/etc/nginx/ssl:ro

  db:
    ports: !override []

  vault:
    ports: !override []

  frontend:
    build:
      target: prod
    volumes: !override []

  backend:
    build:
      target: prod
    volumes: !override
      - vault_backend_runtime_secret:/run/secrets/vault:ro

  migration:
    build:
      target: migration
    volumes: !override
      - vault_migration_secret:/run/secrets/vault:ro

  auth:
    build:
      target: prod
    volumes: !override
      - vault_auth_runtime_secret:/run/secrets/vault:ro
