# NOTE: all services deliberately share the default Compose network. Reviewed
# and accepted: the authentication boundary is possession of each workload's
# AppRole role_id/secret_id file pair (isolated per-service volumes), not
# network reach. Segmented networks are deferred to the production Vault
# design - see .github/copilot-instructions.md "Flat Compose network".
services:
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0-beta.12
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_SERVER_DOMAINS: ${RUSTFS_SERVER_DOMAINS}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  nginx:
    image: docker.io/owasp/modsecurity-crs:4.28.0-nginx-202608050608
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      MODSEC_RULE_ENGINE: DetectionOnly
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_PARTS: FH
      RESOLVER_CONFIG: valid=15s ipv6=off
      FRONTEND_PORT: 80
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/includes/application-locations.conf.template:/etc/nginx/templates/includes/application-locations.conf.template:ro
      - ./nginx/includes/error-pages.conf.template:/etc/nginx/templates/includes/error-pages.conf.template:ro
      - ./nginx/errors:/usr/share/nginx/html/__edge-errors:ro
      - ./nginx/status:/usr/share/nginx/html/health:ro
      - ./nginx/modsecurity/10-task-rabbit-config.conf:/etc/modsecurity.d/owasp-crs/plugins/10-task-rabbit-config.conf:ro
      - ./nginx/99-reload-on-certificate-change.sh:/docker-entrypoint.d/99-reload-on-certificate-change.sh:ro
      - vault_nginx_tls:/etc/nginx/ssl:ro
    depends_on:
      nginx-tls-agent:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      VAULT_DB_ADMIN_PASSWORD: ${VAULT_DB_ADMIN_PASSWORD:?set_vault_db_admin_password_in_env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  vault:
    image: docker.io/hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set_vault_dev_root_token_in_env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  vault-bootstrap:
    build:
      context: ./vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?set_vault_dev_root_token_in_env}
      VAULT_DB_ADMIN_PASSWORD: ${VAULT_DB_ADMIN_PASSWORD:?set_vault_db_admin_password_in_env}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN}
      AUTH_REFRESH_SUCCESSOR_KEY: ${AUTH_REFRESH_SUCCESSOR_KEY:?set_auth_refresh_successor_key_in_env}
      AUTH_PROJECT_API_TOKEN_PEPPER: ${AUTH_PROJECT_API_TOKEN_PEPPER:?set_auth_project_api_token_pepper_in_env}
      SEED_PASSWORD: ${SEED_PASSWORD:?set_seed_password_in_env}
      OAUTH_42_CLIENT_ID: ${OAUTH_42_CLIENT_ID}
      OAUTH_42_CLIENT_SECRET: ${OAUTH_42_CLIENT_SECRET}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
    volumes:
      - ./vault/bootstrap.sh:/vault/bootstrap/bootstrap.sh:ro
      - ./vault/bootstrap/policies:/vault/bootstrap/policies:ro
      - ./vault/bootstrap/sql:/vault/bootstrap/sql:ro
      - vault_auth_runtime_secret:/run/secrets/auth-runtime
      - vault_backend_runtime_secret:/run/secrets/backend-runtime
      - vault_migration_secret:/run/secrets/migration
      - vault_nginx_tls_agent_secret:/run/secrets/nginx-tls
      - vault_pki_ca:/run/pki-ca
      - vault_nginx_tls:/run/nginx-tls
    command: sh /vault/bootstrap/bootstrap.sh
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    restart: "no"

  nginx-tls-agent:
    image: docker.io/hashicorp/vault:1.18
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault/nginx-tls-agent.hcl:/vault/agent/nginx-tls-agent.hcl:ro
      - vault_nginx_tls_agent_secret:/run/secrets/nginx-tls:ro
      - vault_nginx_tls:/run/nginx-tls
    command: agent -config=/vault/agent/nginx-tls-agent.hcl
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/nginx-tls/local.pem && test -s /run/nginx-tls/paris-42-wildcard.pem && test -s /run/nginx-tls/public-domains.pem"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_ORIGIN=${APP_ORIGIN}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - AUTH_CSRF_COOKIE=${AUTH_CSRF_COOKIE}
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID_FILE=/run/secrets/vault/role_id
      - VAULT_SECRET_ID_FILE=/run/secrets/vault/secret_id
      - VAULT_DB_ROLE=backend-runtime
      - VAULT_DB_HOST=db
      - VAULT_DB_PORT=5432
      - VAULT_DB_NAME=${POSTGRES_DB}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET}
      - RUSTFS_REGION=${RUSTFS_REGION}
    volumes:
      - vault_backend_runtime_secret:/run/secrets/vault:ro
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migration:
    profiles: ["tools"]
    build:
      context: ./backend
      target: migration
    command: npx tsx scripts/vault-migrate.ts
    environment:
      - APP_ORIGIN=${APP_ORIGIN}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID_FILE=/run/secrets/vault/role_id
      - VAULT_SECRET_ID_FILE=/run/secrets/vault/secret_id
      - VAULT_DB_ROLE=migration
      - VAULT_DB_HOST=db
      - VAULT_DB_PORT=5432
      - VAULT_DB_NAME=${POSTGRES_DB}
    volumes:
      - vault_migration_secret:/run/secrets/vault:ro
    depends_on:
      db:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully

  vault-test:
    profiles: ["tests"]
    image: docker.io/hashicorp/vault:1.18
    entrypoint: ["/bin/sh", "/vault/check-policies.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault/check-policies.sh:/vault/check-policies.sh:ro
      - vault_auth_runtime_secret:/run/secrets/auth:ro
      - vault_backend_runtime_secret:/run/secrets/backend:ro
      - vault_migration_secret:/run/secrets/migration:ro
    depends_on:
      vault-bootstrap:
        condition: service_completed_successfully

  backend-vault-test:
    profiles: ["tests"]
    build:
      context: ./backend
      target: migration
    command: npx tsx scripts/check-vault-prisma.ts
    environment:
      - VAULT_ADDR=http://vault:8200
      - AUTH_VAULT_ROLE_ID_FILE=/run/secrets/auth/role_id
      - AUTH_VAULT_SECRET_ID_FILE=/run/secrets/auth/secret_id
      - BACKEND_VAULT_ROLE_ID_FILE=/run/secrets/backend/role_id
      - BACKEND_VAULT_SECRET_ID_FILE=/run/secrets/backend/secret_id
      - MIGRATION_VAULT_ROLE_ID_FILE=/run/secrets/migration/role_id
      - MIGRATION_VAULT_SECRET_ID_FILE=/run/secrets/migration/secret_id
      - VAULT_DB_HOST=db
      - VAULT_DB_PORT=5432
      - VAULT_DB_NAME=${POSTGRES_DB}
    volumes:
      - vault_auth_runtime_secret:/run/secrets/auth:ro
      - vault_backend_runtime_secret:/run/secrets/backend:ro
      - vault_migration_secret:/run/secrets/migration:ro
    depends_on:
      db:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully

  auth:
    build:
      context: ./auth
      target: prod
    environment:
      - APP_ORIGIN=${APP_ORIGIN}
      - AUTH_OAUTH_PROVIDERS_CALLBACK_ORIGIN=${AUTH_OAUTH_PROVIDERS_CALLBACK_ORIGIN}
      - AUTH_REFRESH_COOKIE=${AUTH_REFRESH_COOKIE}
      - AUTH_CSRF_COOKIE=${AUTH_CSRF_COOKIE}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - AUTH_REFRESH_IDLE_TTL=${AUTH_REFRESH_IDLE_TTL}
      - AUTH_REFRESH_ABSOLUTE_TTL=${AUTH_REFRESH_ABSOLUTE_TTL}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE}
      - AUTH_JWT_ACCESS_TTL=${AUTH_JWT_ACCESS_TTL}
      - AUTH_JWT_LEEWAY=${AUTH_JWT_LEEWAY}
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID_FILE=/run/secrets/vault/role_id
      - VAULT_SECRET_ID_FILE=/run/secrets/vault/secret_id
      - VAULT_DB_ROLE=auth-runtime
      - VAULT_DB_HOST=db
      - VAULT_DB_PORT=5432
      - VAULT_DB_NAME=${POSTGRES_DB}
      - TOTP_ISSUER=${TOTP_ISSUER}
    volumes:
      - vault_auth_runtime_secret:/run/secrets/vault:ro
    depends_on:
      db:
        condition: service_healthy
      vault-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/auth/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
  backend_node_modules:
  vault_auth_runtime_secret:
  vault_backend_runtime_secret:
  vault_migration_secret:
  vault_nginx_tls_agent_secret:
  vault_pki_ca:
  vault_nginx_tls:
  rustfs_data:
